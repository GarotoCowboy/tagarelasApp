spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=application



rethinkdb.host=${RETHINK_HOST}
rethinkdb.port=${RETHINK_CLIENT_DRIVER_PORT}
rethinkdb.database=${RETHINK_DATABASE}

resilience4j.ratelimiter.configs.publicIpLimit.limit-for-period=10
resilience4j.ratelimiter.configs.publicIpLimit.limit-refresh-period=1m
resilience4j.ratelimiter.configs.publicIpLimit.timeout-duration=0s


spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer